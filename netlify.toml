# =============================================================
# netlify.toml — Réglages de publication sur Netlify
# -------------------------------------------------------------
# Omni-Agenda n'a besoin d'aucune « construction » (build) : les
# fichiers sont publiés tels quels, depuis la racine du dépôt.
# Ce fichier ajoute aussi des règles de sécurité envoyées par le
# serveur avec chaque page.
# =============================================================

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    # Même règle que dans index.html, plus l'interdiction d'afficher
    # Omni-Agenda à l'intérieur d'un autre site (frame-ancestors).
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    # Le navigateur ne devine jamais le type d'un fichier.
    X-Content-Type-Options = "nosniff"
    # Aucune adresse n'est transmise aux sites ouverts depuis Omni-Agenda.
    Referrer-Policy = "no-referrer"
    # Omni-Agenda n'utilise ni caméra, ni micro, ni position, ni paiement.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
