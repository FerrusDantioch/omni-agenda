<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Omni-Agenda">
  <!--
    Logo d'Omni-Agenda : un dé à 20 faces violet entouré d'un anneau lumineux.
    Chaque face est un triangle ; les teintes différentes donnent l'effet de relief.
  -->
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="72%" stop-color="#b18cff" stop-opacity="0"/>
      <stop offset="88%" stop-color="#b18cff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#b18cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Anneau lumineux (halo doux + trait net) -->
  <circle cx="50" cy="50" r="49" fill="url(#halo)"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="#bf9dff" stroke-width="3"/>

  <!-- Faces du dé -->
  <g stroke="#ece2ff" stroke-width="1.4" stroke-linejoin="round">
    <!-- 6 faces extérieures -->
    <polygon points="50,31 50,16 79.44,33" fill="#8a60ec"/>
    <polygon points="50,31 50,16 20.56,33" fill="#7d52e3"/>
    <polygon points="66.45,59.5 79.44,33 79.44,67" fill="#6c43d4"/>
    <polygon points="66.45,59.5 79.44,67 50,84" fill="#5d36c1"/>
    <polygon points="33.55,59.5 50,84 20.56,67" fill="#5a33bd"/>
    <polygon points="33.55,59.5 20.56,67 20.56,33" fill="#7148d9"/>
    <!-- 3 faces autour du centre -->
    <polygon points="50,31 66.45,59.5 79.44,33" fill="#9b74f5"/>
    <polygon points="66.45,59.5 33.55,59.5 50,84" fill="#8259e6"/>
    <polygon points="33.55,59.5 50,31 20.56,33" fill="#946bf2"/>
    <!-- Face centrale, la plus claire -->
    <polygon points="50,31 66.45,59.5 33.55,59.5" fill="#c4a6ff"/>
  </g>
</svg>
